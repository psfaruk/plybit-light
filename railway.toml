[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/api/pairs"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[services]]
name = "playbit-backend"
source = "backend"

[[services]]
name = "playbit-frontend"
source = "frontend"

[[services]]
name = "go-streamer"
source = "go-streamer"
